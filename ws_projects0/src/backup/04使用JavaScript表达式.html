<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 使用 JavaScript 表达式示例</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<!-- Vue 控制的 DOM 区域 -->
<div id="app">
    <!-- 1. 数学运算 -->
    <p>{{ number + 1 }}</p>

    <!-- 2. 三元运算符 -->
    <p>{{ ok ? 'True' : 'False' }}</p>

    <!-- 3. 字符串处理：反转字符串 -->
    <p>{{ message.split('').reverse().join('') }}</p>

    <!-- 4. 动态绑定 id 属性 -->
    <p :id="'list-' + id">xxx</p>

    <!-- 5. 访问嵌套对象的属性 -->
    <p>{{ user.name }}</p>
</div>

<script>
    // 创建 Vue 应用实例
    const vm = {
        data() {
            return {
                number: 9,            // 数字
                ok: false,            // 布尔值
                message: 'ABC',       // 字符串
                id: 3,                // 用于动态生成 ID
                user: {               // 嵌套对象
                    name: 'zs'
                }
            };
        }
    };

    // 挂载 Vue 应用到 #app
    const app = Vue.createApp(vm);
    app.mount("#app");
</script>
</body>
</html>
