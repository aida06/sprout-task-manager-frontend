<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 列表渲染指令示例</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<!-- Vue 控制的 DOM 区域 -->
<div id="app">
    <ul>
        <!-- 使用 v-for 渲染列表 -->
        <li v-for="(user, i) in userList" :key="user.id">
            索引是：{{ i }}，姓名是：{{ user.name }}
        </li>
    </ul>
</div>

<script>
    const vm = {
        data() {
            return {
                // 用户列表数据
                userList: [
                    { id: 1, name: 'zhangsan' },
                    { id: 2, name: 'lisi' },
                    { id: 3, name: 'wangwu' }
                ]
            };
        }
    };

    // 创建 Vue 应用并挂载到 #app
    const app = Vue.createApp(vm);
    app.mount('#app');
</script>
</body>
</html>
