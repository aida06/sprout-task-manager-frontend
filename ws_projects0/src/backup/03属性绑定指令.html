<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 属性绑定指令示例</title>
    <!-- 引入 Vue 3（使用更稳定的 CDN） -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<!-- Vue 控制的 DOM 区域 -->
<div id="app">
    <!-- 1. 动态绑定链接地址 -->
    <a :href="link">百度</a>

    <!-- 2. 动态绑定文本框的占位符 -->
    <input type="text" :placeholder="inputValue">

    <!-- 3. 动态绑定图片的 src 和样式 -->
    <img :src="imgSrc" :style="{ width: w }" alt="示例图片">
</div>

<script>
    // 创建 Vue 应用实例
    const vm = {
        data() {
            return {
                link: "http://www.baidu.com",    // 链接地址
                inputValue: "请输入内容",          // 输入框的占位符
                imgSrc: "/src/assets/vue.svg",     // 图片的路径
                w: "100px"                       // 图片宽度
            };
        }
    };

    // 挂载 Vue 应用到 #app
    const app = Vue.createApp(vm);
    app.mount("#app");
</script>
</body>
</html>
