<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 条件渲染指令示例</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<!-- Vue 控制的 DOM 区域 -->
<div id="app">
    <!-- 按钮：点击切换 flag 的值（true/false） -->
    <button @click="flag = !flag">Toggle Flag</button>

    <!-- 1. 使用 v-if 控制元素的渲染 -->
    <p v-if="flag">请求成功 --- 被 v-if 控制</p>

    <!-- 2. 使用 v-show 控制元素的显示/隐藏 -->
    <p v-show="flag">请求成功 --- 被 v-show 控制</p>
</div>

<script>
    // 创建 Vue 应用实例
    const vm = {
        data() {
            return {
                flag: false  // 初始值为 false
            };
        }
    };

    // 挂载 Vue 应用到 #app
    const app = Vue.createApp(vm);
    app.mount("#app");
</script>
</body>
</html>
