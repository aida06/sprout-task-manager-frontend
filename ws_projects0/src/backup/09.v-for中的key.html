<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue v-for 中的 key 使用示例</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<div id="app">
    <!-- 添加用户的输入区域 -->
    <div>
        <input type="text" v-model="name" placeholder="输入用户名">
        <button @click="addNewUser">添加用户</button>
    </div>

    <!-- 用户列表区域 -->
    <ul>
        <li v-for="(user, index) in userlist" :key="user.id">
            <input type="checkbox"> 姓名：{{ user.name }}
        </li>
    </ul>
</div>

<script>
    const vm = {
        data() {
            return {
                // 用户列表初始数据
                userlist: [
                    { id: 1, name: 'zs' },
                    { id: 2, name: 'ls' }
                ],
                name: '' // 用于绑定输入框的用户名称
            };
        },
        methods: {
            // 添加新用户的方法
            addNewUser() {
                if (this.name.trim() !== '') {
                    const newUser = {
                        id: this.userlist.length + 1, // 自动生成唯一 ID
                        name: this.name.trim()
                    };
                    this.userlist.push(newUser); // 添加到用户列表
                    this.name = ''; // 清空输入框
                }
            }
        }
    };

    // 创建 Vue 应用并挂载到 #app
    const app = Vue.createApp(vm);
    app.mount('#app');
</script>
</body>
</html>
