<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue 基本用法示例</title>

    <!-- 1. 导入 Vue 的脚本文件 -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<!-- 2. 声明要被 Vue 所控制的 DOM 区域 -->
<div id="app">
    <!-- 使用 Vue 模板语法，绑定 message 数据 -->
    {{ message }}
</div>

<!-- 3. 创建 Vue 的实例对象 -->
<script>
    const hello = {
        // data 是一个函数，返回一个对象，包含 Vue 的数据模型
        // 这相当于 MVVM 模式中的 Model（数据模型）
        data: function() {
            return {
                message: 'Hello Vue!'  // 定义 message 属性，绑定到模板中
            };
        }
    };

    // 创建 Vue 应用实例，并将其挂载到 id="app" 的 DOM 元素上
    const app = Vue.createApp(hello);
    app.mount('#app');
</script>
</body>
</html>
