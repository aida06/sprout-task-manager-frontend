<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 事件绑定指令示例</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<!-- Vue 控制的 DOM 区域 -->
<div id="app">
    <!-- 显示 count 的值 -->
    <h3>count 的值为：{{ count }}</h3>

    <!-- 1. 使用 v-on 指令绑定点击事件（完整写法） -->
    <button v-on:click="addCount">+1 (使用 v-on:click)</button>

    <!-- 2. 使用 @ 符号绑定点击事件（简写形式） -->
    <button @click="count += 1">+1 (使用 @click)</button>
</div>

<script>
    // 创建 Vue 应用实例
    const vm = {
        data() {
            return {
                count: 0  // 初始值为 0
            };
        },
        methods: {
            // 定义点击事件处理函数
            addCount() {
                this.count += 1;  // 每次点击按钮 count + 1
            }
        }
    };

    // 挂载 Vue 应用到 #app
    const app = Vue.createApp(vm);
    app.mount("#app");
</script>
</body>
</html>
